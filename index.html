<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista De Super</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .completed {
            text-decoration: line-through;
            opacity: 0.55;
            color: #64748b;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-slate-800">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-200/80">
        <!-- 1. Título visible -->
        <h1 class="text-3xl font-extrabold text-slate-900 text-center mb-6 tracking-tight">Lista De Super</h1>
        
        <!-- 2. Barra de entrada de texto y Botón Agregar -->
        <div class="space-y-3 mb-6">
            <div class="flex gap-2">
                <input type="text" id="itemInput" placeholder="Escribe un producto..." 
                       class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-slate-800 bg-slate-50 placeholder-slate-400">
                
                <button id="addBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-5 rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center gap-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Agregar
                </button>
            </div>
            
            <div id="feedbackMsg" class="hidden text-xs text-center font-medium p-2 rounded-lg transition-all"></div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Productos (<span id="itemCount">0</span>)</h2>
                <button id="logConsoleBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold transition">Probar logItems()</button>
            </div>
            
            <!-- Lista interactiva de productos -->
            <ul id="superList" class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                <!-- Se llena dinámicamente -->
            </ul>
        </div>
    </main>

    <script>
        let listaDeSuper = [];
        
        listaDeSuper.push("Dulce de Leche");
        listaDeSuper.push("1 kilo de naranja");
        listaDeSuper.push("Carne");
        listaDeSuper.push("Hamburgesas");
        listaDeSuper.push("Pan de Hamburgesas");
        listaDeSuper.push("Laxante Poderoso");
        
        let primerElemento = listaDeSuper[0];
        let ultimoElemento = listaDeSuper.length - 1;
        let elementoFinal = listaDeSuper[ultimoElemento];

        // INSTRUCCIONES ORIGINALES
        let largoActual = listaDeSuper.length;
        let noHabia = listaDeSuper.pop();
        let comprado = listaDeSuper.shift();
        let largoFinal = listaDeSuper.length;

        // 1. Función logItems con .forEach()
        function logItems(arreglo) {
            console.log("--- Lista de Supermercado ---");
            arreglo.forEach((producto, indice) => {
                console.log(indice + ": " + producto);
            });
        }

        // DOM elements
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const superList = document.getElementById('superList');
        const itemCount = document.getElementById('itemCount');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const logConsoleBtn = document.getElementById('logConsoleBtn');

        function showNotification(msg, isError = false) {
            feedbackMsg.textContent = msg;
            feedbackMsg.className = `text-xs text-center font-medium p-2 rounded-lg transition-all ${
                isError ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'
            }`;
            feedbackMsg.classList.remove('hidden');
            setTimeout(() => {
                feedbackMsg.classList.add('hidden');
            }, 2000);
        }

        // Eliminar producto por su índice usando .splice()
        function deleteItem(index) {
            const borrado = listaDeSuper.splice(index, 1);
            showNotification(`Se eliminó: "${borrado[0]}"`);
            renderList();
            logItems(listaDeSuper);
        }

        // Renderizar la lista
        function renderList() {
            superList.innerHTML = '';
            
            if (listaDeSuper.length === 0) {
                superList.innerHTML = `<li class="text-center text-slate-400 italic py-6">La lista está vacía</li>`;
                itemCount.textContent = '0';
                return;
            }

            listaDeSuper.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl border border-slate-200/70 transition select-none group';
                
                // Div interactivo para tachar
                const textContainer = document.createElement('div');
                textContainer.className = 'flex items-center gap-2 flex-1 cursor-pointer mr-2';
                
                const indexSpan = document.createElement('span');
                indexSpan.className = 'font-mono text-xs font-bold text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200';
                indexSpan.textContent = `${index}:`;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'font-medium text-slate-700 transition-all';
                nameSpan.textContent = item;

                textContainer.appendChild(indexSpan);
                textContainer.appendChild(nameSpan);

                // Evento para tachar/destachar al hacer clic
                textContainer.addEventListener('click', () => {
                    nameSpan.classList.toggle('completed');
                });

                // Botón con ícono de tacho de basura
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-slate-400 hover:text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition-colors flex items-center justify-center';
                deleteBtn.title = 'Eliminar producto';
                deleteBtn.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                `;
                
                // Evento de eliminación directa por tacho de basura
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteItem(index);
                });

                li.appendChild(textContainer);
                li.appendChild(deleteBtn);
                superList.appendChild(li);
            });

            itemCount.textContent = listaDeSuper.length;
        }

        // Agregar nuevo producto
        function addItem() {
            const val = itemInput.value.trim();
            if (val === '') {
                showNotification('Ingresa el nombre de un producto', true);
                return;
            }
            listaDeSuper.push(val);
            renderList();
            showNotification(`"${val}" fue agregado`);
            itemInput.value = '';
            itemInput.focus();
            logItems(listaDeSuper);
        }

        // Listeners
        addBtn.addEventListener('click', addItem);
        logConsoleBtn.addEventListener('click', () => logItems(listaDeSuper));
        
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        // Carga inicial
        renderList();
        logItems(listaDeSuper);
    </script>
</body>
</html>
