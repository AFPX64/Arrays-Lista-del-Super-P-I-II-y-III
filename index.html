<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista del Super</title>
</head>
<body>
    
    <h1>Lista del Super</h1>
    <script>
        
        let listaDeSuper = [];
        
        listaDeSuper.push("Dulce de Leche");
        listaDeSuper.push("1 kilo de naranja");
        listaDeSuper.push("Carne");
        listaDeSuper.push("Hamburgesas");
        listaDeSuper.push("Pan de Hamburgesas");
        listaDeSuper.push("Laxante Poderoso");
        
        let primerElemento = listaDeSuper[0];
        let ultimoElemento = listaDeSuper.length - 1;
        let elementoFinal = listaDeSuper[ultimoElemento];

        // INSTRUCIONES
        
        // 1.  Agrega productos al final de la lista usando .push("y el item")  Ej ListaDeSuper.push("Carne")
        
        // 2. Agregá dos productos al principio de tu lista usando .unshift("y el item")
        
        // 3. Modifica el largodel Array actual usando la propiedad length
        let largoActual = listaDeSuper.length;

        // 4. Mover producto del final a variable "noHabia" usando .pop()
        let noHabia = listaDeSuper.pop();

        // 5. Mover productgo del principio a variable "comprado" usando .shift()
        let comprado = listaDeSuper.shift();

        // 6.Guardar nueva longitud
        let largoFinal = listaDeSuper.length;

        function logItems(arreglo) {
            arreglo.forEach((producto, indice) => {
                console.log(indice + ": " + producto);
            });
        }

        let comando = "";
        while (comando !== "salir") {
            comando = prompt("Comando (nuevo, listar, borrar, salir):");

            if (comando === "nuevo") {
                let nuevo = prompt("Ingrese producto:");
                listaDeSuper.push(nuevo);
            } else if (comando === "listar") {
                logItems(listaDeSuper);
            } else if (comando === "borrar") {
                let i = prompt("Índice a borrar:");
                let borrado = listaDeSuper.splice(i, 1);
                console.log("Borrado: " + borrado[0]);
            }
        }
    </script>
</body>
</html>
